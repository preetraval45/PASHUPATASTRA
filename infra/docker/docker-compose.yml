# Local development stack, and the seed of the on-prem distribution.
#
# Every service here is the self-hosted counterpart of an AWS managed service
# (docs/DEPLOYMENT.md). CI runs the benchmark against this stack so the on-prem
# path fails the build rather than rotting quietly until the first enterprise deal.

name: pashupatastra

services:
  postgres: # ↔ RDS PostgreSQL
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pashupatastra
      POSTGRES_PASSWORD: pashupatastra # local only; AWS uses Secrets Manager
      POSTGRES_DB: pashupatastra
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pashupatastra"]
      interval: 5s
      retries: 10

  redis: # ↔ ElastiCache
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  opensearch: # ↔ OpenSearch Service
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

  prometheus: # ↔ Amazon Managed Prometheus
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana: # ↔ Amazon Managed Grafana
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin # local only
    ports: ["3001:3000"]
    depends_on: [prometheus]

  minio: # ↔ S3
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pashupatastra
      MINIO_ROOT_PASSWORD: pashupatastra # local only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
