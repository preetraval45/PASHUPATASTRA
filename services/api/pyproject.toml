[project]
name = "pashupatastra-api"
version = "0.1.0"
description = "Pashupatastra API — incident, agent, reasoning, policy, action, audit engines"
requires-python = ">=3.11"
dependencies = [
    "pashupatastra-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# AWS lives here, never in packages/core (the Platform ADR).
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
pashupatastra-core = { path = "../../packages/core", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Filenames carry no underscores, so widen pytest discovery from test_*.py
python_files = ["test*.py"]
