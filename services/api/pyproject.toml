[project]
name = "pashupatastra-api"
version = "0.1.0"
description = "Pashupatastra API — incident, agent, reasoning, policy, action, audit engines"
requires-python = ">=3.11"
dependencies = [
    "pashupatastra-core",
    "pashupatastra-connectors",
    "psycopg[binary]>=3.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# AWS lives here, never in packages/core (the Platform ADR).
aws = ["boto3>=1.34"]
# ASGI-to-Lambda adapter. Only the Lambda deployment needs it; uvicorn serves
# the same app everywhere else.
lambda = ["mangum>=0.17"]
# Model SDKs live here for the same reason. Optional so a deployment installs
# only the provider it uses, and so neither is importable from engine code by
# accident — engines reach models through the gateway or not at all (rule 5).
bedrock = ["anthropic[bedrock]>=0.69"]
anthropic = ["anthropic>=0.69"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5,<0.13", "mypy>=1.10", "jsonschema>=4.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
pashupatastra-core = { path = "../../packages/core", editable = true }
pashupatastra-connectors = { path = "../../packages/connectors", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Filenames carry no underscores, so widen pytest discovery from test_*.py
python_files = ["test*.py"]
