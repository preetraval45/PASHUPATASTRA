<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pashupatastra">
  <title>Pashupatastra</title>
  <!--
    The mark, read outward from the centre:
      circle      the closed loop — Observe → Reason → Act → Verify → Learn
      shaft       the arrow, in flight, left to right
      star node   the decision point where policy is evaluated
      trident     the astra — the arrowhead, in gold
      fletching   the signals entering from behind: metrics, logs, traces
    Geometry only. No illustration, no deity, no ornament.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the loop -->
    <circle cx="32" cy="32" r="27" stroke="#2FA3A0" stroke-opacity="0.38" stroke-width="1.5"/>

    <!-- signals converging into the shaft -->
    <g stroke="#2FA3A0" stroke-opacity="0.55" stroke-width="1.5">
      <path d="M6 24 L14 30"/>
      <path d="M6 40 L14 34"/>
      <path d="M13 22 L19 29"/>
      <path d="M13 42 L19 35"/>
    </g>

    <!-- shaft -->
    <path d="M12 32 H44" stroke="#2FA3A0" stroke-width="2.25"/>

    <!-- decision node -->
    <g stroke="#C9A227" stroke-width="1.6">
      <path d="M28 32 H36"/>
      <path d="M32 28 V36"/>
      <path d="M29.2 29.2 L34.8 34.8"/>
      <path d="M34.8 29.2 L29.2 34.8"/>
    </g>

    <!-- trident head -->
    <g stroke="#C9A227" stroke-width="2.25">
      <path d="M44 23 V41"/>
      <path d="M44 23 L53.5 29.5"/>
      <path d="M44 32 H58"/>
      <path d="M44 41 L53.5 34.5"/>
    </g>
  </g>
</svg>
