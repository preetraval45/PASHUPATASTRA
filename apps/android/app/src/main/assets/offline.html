<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d11; color: #e6e8ec;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: #9aa1ad; margin: 0 0 1.5rem; }
    button { font: inherit; font-weight: 600; color: #fff; background: #2fa3a0; border: 0; border-radius: .6rem;
             padding: .75rem 1.5rem; min-height: 48px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Pashupatastra needs a connection to load. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="window.PashupatastraApp ? PashupatastraApp.retry() : location.reload()">Try again</button>
  </main>
</body>
</html>
