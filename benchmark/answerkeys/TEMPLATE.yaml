# RP-13 — answer keys for the 12 new test incidents. FOR THE OWNER TO FILL.
#
# Why you, not Claude: the same AI built the system, so if it also wrote the
# answers, the test would grade itself. Your keys, committed before any run, are
# what make these 20 incidents an independent test (PAPER §9, first threat).
#
# How:
#   1. Fill every TODO below. Plain sentences are fine; keep labels short.
#   2. Save a copy as `benchmark/answerkeys/rp13.yaml`.
#   3. Commit that file ALONE:  git add benchmark/answerkeys/rp13.yaml
#                              git commit -m "test(rp-13): answer keys, before any run"
#   4. Tell Claude. Claude then builds SC-0009..SC-0020 from your specs and runs
#      the loader and benchmark. Nothing is run against them before step 3.
#
# Fields:
#   expectation      incident | nothing (benign look-alike) | escalate (a human must decide)
#   cause            what really happened, one sentence (empty for `nothing`)
#   root_cause_label the entity at fault, exactly as it will appear as an option, e.g. service:checkout-api
#   options          4–6 candidate labels the diagnoser chooses from: the answer plus plausible wrong ones
#   red_herrings     signals that look guilty but are not, and why
#   correct_action   the action you would approve (e.g. rollback_deployment), or `none` / `escalate`
#
# The slots below keep the full 20 at about 25% negative and 15% escalation.
# Change any slot's expectation if you prefer a different mix; say why in `notes`.

example:  # SC-0001, already in the corpus, to show the shape
  expectation: incident
  cause: A bad deploy (v4.21) of checkout-api leaked database connections until the pool saturated.
  root_cause_label: service:checkout-api
  options: [service:checkout-api, service:payments, db:orders-primary, service:frontend]
  red_herrings: db:orders-primary shows high connections, but as the victim, not the cause.
  correct_action: rollback_deployment

# The 8 incidents already in the corpus need keys too: RP-15 scores all 20.
# Claude PROPOSED these from each fixture's `root_cause` line. Confirm or
# correct each one, especially the `options`, which set how hard the question
# is. Two need a decision, not just a confirmation; they are marked DECIDE.
SC-0001: {expectation: incident, root_cause_label: service:checkout-api, options: [service:checkout-api, service:payments-gateway, db:orders-primary, service:frontend], correct_action: rollback_deployment}
SC-0002: {expectation: incident, root_cause_label: DECIDE, options: [DECIDE], correct_action: DECIDE, notes: "two independent failures; one label cannot be right. Exclude from RCA@1, or key it as two cases?"}
SC-0003: {expectation: nothing, root_cause_label: none, options: [none, service:checkout-api, service:payments-gateway, service:frontend], correct_action: none}
SC-0004: {expectation: incident, root_cause_label: service:payments-gateway, options: [service:payments-gateway, service:checkout-api, db:orders-primary, service:frontend], red_herrings: "the checkout-api deployment", correct_action: escalate}
SC-0005: {expectation: incident, root_cause_label: service:checkout-api, options: [service:checkout-api, service:payments-gateway, db:orders-primary, service:frontend], correct_action: scale_service}
SC-0006: {expectation: incident, root_cause_label: service:billing-api, options: [service:billing-api, service:checkout-api, db:billing-primary, service:frontend], correct_action: scale_service}
SC-0007: {expectation: nothing, root_cause_label: none, options: [none, service:search-api, service:frontend, db:search-index], correct_action: none}
SC-0008: {expectation: escalate, root_cause_label: DECIDE, options: [DECIDE], correct_action: escalate, notes: "no shared cause is visible. Is the right diagnosis `none` (decline), or should it be excluded from RCA@1?"}

