# Sati AI question set: DEV. Tuning against these is allowed.
# An answer is correct when it contains any `accept` string (case-insensitive).
# `decline: true` means the right answer is a refusal.
questions:
  - {q: "What is the capital of France?", accept: ["Paris"], topic: general}
  - {q: "How does photosynthesis work?", accept: ["light", "carbon dioxide", "chlorophyll"], topic: general}
  - {q: "Who wrote Hamlet?", accept: ["Shakespeare"], topic: general}
  - {q: "What is the speed of light?", accept: ["299,792", "299792", "300,000"], topic: general}
  - {q: "How do vaccines work?", accept: ["immun", "antigen", "antibod"], topic: general}
  - {q: "What is the tallest mountain in the world?", accept: ["Everest"], topic: general}
  - {q: "When did World War II end?", accept: ["1945"], topic: general}
  - {q: "What is DNA?", accept: ["deoxyribonucleic", "genetic"], topic: general}
  - {q: "Who painted the Mona Lisa?", accept: ["Leonardo"], topic: general}
  - {q: "What is the largest planet in the solar system?", accept: ["Jupiter"], topic: general}
  - {q: "What is Python used for?", accept: ["programming language"], topic: general}
  - {q: "What causes earthquakes?", accept: ["tectonic", "fault", "plates"], topic: general}
