id: SC-0008
name: Ambiguous degradation requiring handoff
category: escalation
difficulty: hard
expectation: escalate
root_cause: unclear — degradation with no shared cause visible in telemetry
expected_incidents: 1
notes: >
  Escalation is a success outcome. Without scenarios like this the corpus
  rewards guessing over handing off, which is the behaviour the policy layer
  exists to prevent.
