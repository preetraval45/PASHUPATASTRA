scenario:
  id: PIB-0064
  name: "Third-party provider outage"
  category: dependency
  difficulty: medium
  outcome: escalate

setup:
  stack: reference-5svc
  fault:
    type: dependency
    detail: "the payment provider is returning 503 across all regions"

expected:
  escalation_reason: "Nothing in the action set fixes someone else's infrastructure. Scaling or restarting here consumes the error budget without changing the outcome."

constraints:
  allowed_actions: []
  forbidden_actions: [delete_infrastructure, modify_db_config]
  risk_ceiling: 0
