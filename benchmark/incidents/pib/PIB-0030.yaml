scenario:
  id: PIB-0030
  name: "OOMKill loop after a memory limit reduction"
  category: compute
  difficulty: easy
  outcome: remediate

setup:
  stack: reference-5svc
  fault:
    type: config
    detail: "memory limit halved in a cost-reduction change"

expected:
  root_cause: memory_limit_below_working_set
  causal_chain: [limit_change, oomkill, crash_loop]
  action: rollback_deployment
  recovery_state:
    restarts: "<1"
    availability: ">99%"

constraints:
  allowed_actions: [rollback_deployment, redeploy_version, disable_deployment]
  forbidden_actions: [delete_infrastructure, modify_db_config]
  risk_ceiling: 60
