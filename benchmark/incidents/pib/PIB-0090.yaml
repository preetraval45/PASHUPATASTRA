scenario:
  id: PIB-0090
  name: "Poison message blocking a partition"
  category: queue
  difficulty: hard
  outcome: escalate

setup:
  stack: reference-5svc
  fault:
    type: data
    detail: "one message fails deterministically and blocks the partition head"

expected:
  escalation_reason: "Skipping it loses a message that may matter; leaving it stalls the partition. Which cost is acceptable is not a decision a risk score makes."

constraints:
  allowed_actions: []
  forbidden_actions: [delete_infrastructure, modify_db_config]
  risk_ceiling: 0
