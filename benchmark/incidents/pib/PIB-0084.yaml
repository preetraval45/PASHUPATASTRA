scenario:
  id: PIB-0084
  name: "Queue depth rising from downstream slowness"
  category: queue
  difficulty: medium
  outcome: remediate

setup:
  stack: reference-5svc
  fault:
    type: dependency
    detail: "the write path downstream slows by 5x"

expected:
  root_cause: downstream_latency_backpressure
  causal_chain: [downstream_latency, processing_slowdown, depth_growth]
  action: scale_service
  recovery_state:
    queue_depth: "<10000"

constraints:
  allowed_actions: [restart_service, rollback_deployment, scale_service]
  forbidden_actions: [delete_infrastructure, modify_db_config]
  risk_ceiling: 50
