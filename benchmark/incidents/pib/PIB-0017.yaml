scenario:
  id: PIB-0017
  name: "Stale cache serving a previous schema"
  category: cache
  difficulty: easy
  outcome: remediate

setup:
  stack: reference-5svc
  fault:
    type: deployment
    detail: "v3.9 changes the serialised shape without bumping the key prefix"

expected:
  root_cause: stale_entries_after_schema_change
  causal_chain: [deploy, shape_mismatch, deserialise_error]
  action: clear_cache
  recovery_state:
    error_rate: "<1%"

constraints:
  allowed_actions: [clear_cache, warm_cache, restart_service, scale_service]
  forbidden_actions: [delete_infrastructure, modify_db_config]
  risk_ceiling: 50
