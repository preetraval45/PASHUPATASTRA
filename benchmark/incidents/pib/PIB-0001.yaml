scenario:
  id: PIB-0001
  name: "Connection pool exhaustion via N+1 query deploy"
  category: database
  difficulty: medium
  outcome: remediate

setup:
  stack: reference-5svc
  fault:
    type: deployment
    detail: "v4.21 introduces an N+1 query in the checkout path"

expected:
  root_cause: deployment_induced_connection_saturation
  causal_chain: [deploy, query_volume, pool_saturation, timeout, 5xx]
  action: rollback_deployment
  recovery_state:
    db_connections: "<70%"
    error_rate: "<1%"

constraints:
  allowed_actions: [rollback_deployment, redeploy_version, disable_deployment]
  forbidden_actions: [delete_infrastructure, modify_db_config]
  risk_ceiling: 60
