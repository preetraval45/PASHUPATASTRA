name: Benchmark

# PIB runs on GitHub's runners, not on anyone's PC: each variant gets its own
# kind cluster on an identical ubuntu-latest machine, so the rows of a table
# come from the same setup. RESEARCH PLAN.md RP-01.
#
# The tables job commits the run records (benchmark/results/, force-added
# past .gitignore), the generated tables and the /evaluation page's data, so
# every published arm number can be rebuilt from the repository
# (scripts/reproduce.py --check) and the page cannot lag the records.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/benchmark.yml]

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  run:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pashupatastra
            args: --arm pashupatastra
          - name: pashupatastra-no-policy
            args: --arm pashupatastra --ablation no-policy
          - name: pashupatastra-no-verification
            args: --arm pashupatastra --ablation no-verification
          - name: runbook
            args: --arm runbook
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e packages/core
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: pashupatastra
      - run: kubectl get nodes
      - run: python -m benchmark.harness.run --runs 3 ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: records-${{ matrix.name }}
          path: benchmark/results/
          if-no-files-found: error

  llm:
    # RP-07 / RP-09 (adr/LLMBaselines): the two LLM arms x three models, N = 3.
    # Ollama runs on the GitHub runner itself (CPU, 16 GB) - slow, free, and
    # needing no endpoint or secret. Each job pulls one model and brings up its
    # own kind cluster, so a model's rows never share a machine with another's.
    name: ${{ matrix.arm }} · ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        arm: [naive-llm, pashupatastra-llm]
        model: ["qwen2.5:7b", "mistral", "llama3"]
    env:
      PASHU_BASELINE_BASE_URL: http://localhost:11434/v1
      PASHU_BASELINE_MODEL: ${{ matrix.model }}
      PASHU_BASELINE_TEMPERATURE: "0.2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e packages/core
      - name: Ollama, serving one model on CPU
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "${{ matrix.model }}"
          ollama --version
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: pashupatastra
      - run: kubectl get nodes
      - run: python -m benchmark.harness.run --runs 3 --arm ${{ matrix.arm }}
      - name: name the artifact after the model
        id: slug
        run: echo "slug=$(echo '${{ matrix.model }}' | tr -c 'a-zA-Z0-9' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: records-${{ matrix.arm }}-${{ steps.slug.outputs.slug }}
          path: benchmark/results/
          if-no-files-found: error

  tables:
    needs: [run, llm]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e packages/core
      - uses: actions/download-artifact@v8
        with:
          pattern: records-*
          path: benchmark/results
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: pib-records
          path: benchmark/results/
      - run: python scripts/papertables.py > docs/research/tables.md
      - run: python scripts/buildevaluation.py
      - name: Commit regenerated tables
        run: |
          bash scripts/pushresults.sh "docs(tables): regenerate from benchmark run ${{ github.run_id }}" docs/research/tables.md apps/web/lib/evaluation.generated.json benchmark/results
