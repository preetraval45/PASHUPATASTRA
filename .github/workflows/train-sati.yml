name: Train Sati models

# Sati models are trained here, on GitHub's runners, on real public data —
# never on the owner's machine (adr/RealDataModels). The repository is public,
# so these minutes are free.
#
# Test, then train and evaluate on every split, then commit the generated
# results table. The trained model and the full results are kept as the
# `sati-rca` artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/sati/**
      # The detectors are scored by the core harness, so a scoring change must re-run them.
      - packages/core/pashupatastra/evaluation.py
      - packages/core/pashupatastra/kaal/**
      - docs/research/datasets/**
      - .github/workflows/train-sati.yml

permissions:
  contents: read

concurrency:
  group: train-sati
  cancel-in-progress: false

jobs:
  changes:
    # Which models this push touched. Every retrain moves LightGBM's numbers
    # by a few hundredths (runner CPUs differ, and `deterministic` does not
    # hold across them), so retraining models whose code and data did not
    # change only churns the published tables. A manual dispatch runs them all.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kushmanda-smoke: ${{ steps.filter.outputs.kushmanda-smoke }}
      sati-rca: ${{ steps.filter.outputs.sati-rca }}
      shailaputri: ${{ steps.filter.outputs.shailaputri }}
      shailaputri-smd: ${{ steps.filter.outputs.shailaputri-smd }}
      mahagauri: ${{ steps.filter.outputs.mahagauri }}
      skandamata: ${{ steps.filter.outputs.skandamata }}
      siddhidatri: ${{ steps.filter.outputs.siddhidatri }}
      katyayani-kaal: ${{ steps.filter.outputs.katyayani-kaal }}
      katyayani-simtoreal: ${{ steps.filter.outputs.katyayani-simtoreal }}
      kalaratri: ${{ steps.filter.outputs.kalaratri }}
      brahmacharini: ${{ steps.filter.outputs.brahmacharini }}
      katyayani-pooled: ${{ steps.filter.outputs.katyayani-pooled }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/sati/sati/sources/**'
              - 'packages/sati/pyproject.toml'
            kushmanda-smoke:
              - *shared
              - 'packages/sati/sati/lm/**'
            sati-rca:
              - *shared
              - 'packages/sati/sati/rca/run.py'
              - 'packages/sati/sati/rca/model.py'
              - 'packages/sati/sati/rca/features.py'
              - 'packages/sati/sati/rca/report.py'
            shailaputri:
              - *shared
              - 'packages/sati/sati/detect/**'
              - 'packages/core/pashupatastra/evaluation.py'
            shailaputri-smd:
              - *shared
              - 'packages/sati/sati/detect/**'
              - 'packages/core/pashupatastra/evaluation.py'
            mahagauri:
              - *shared
              - 'packages/sati/sati/verify/**'
              - 'packages/sati/sati/detect/**'
            skandamata:
              - *shared
              - 'packages/sati/sati/respond/**'
            siddhidatri:
              - *shared
              - 'packages/sati/sati/fuse/**'
              - 'packages/sati/sati/detect/**'
              - 'packages/core/pashupatastra/evaluation.py'
            katyayani-kaal:
              - *shared
              - 'packages/sati/sati/rca/kaal.py'
              - 'packages/sati/sati/rca/kaalreport.py'
              - 'packages/sati/sati/rca/model.py'
              - 'packages/core/pashupatastra/kaal/**'
              - 'docs/research/datasets/**'
            katyayani-simtoreal:
              - *shared
              - 'packages/sati/sati/rca/simtoreal.py'
              - 'packages/sati/sati/rca/simtoreport.py'
              - 'packages/sati/sati/rca/kaal.py'
              - 'packages/sati/sati/rca/model.py'
              - 'packages/sati/sati/rca/features.py'
              - 'packages/sati/sati/rca/external.py'
              - 'packages/core/pashupatastra/kaal/**'
              - 'benchmark/external/rcaeval/**'
            katyayani-pooled:
    # Katyayani v1: RCAEval plus the live stack (RP-19), each of the four
    # systems held out in turn; v0 and v1 compared on the same cases.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.katyayani-pooled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/rcaeval
          key: rcaeval-v1
      - name: train and evaluate on four systems
        working-directory: packages/sati
        run: python -m sati.rca.pooled --cache ../../.cache/rcaeval --live ../../benchmark/live/dataset --out ../../results/katyayani-pooled
      - name: commit the generated results
        run: |
          cp results/katyayani-pooled/results.json docs/research/models/katyayani-pooled.results.json
          (cd packages/sati && python -m sati.rca.pooledreport ../../results/katyayani-pooled/results.json) > docs/research/models/katyayani-pooled.md
          bash scripts/pushresults.sh "docs(models): Katyayani v1 on four systems from run ${{ github.run_id }}" docs/research/models/katyayani-pooled.results.json docs/research/models/katyayani-pooled.md

  kalaratri:
              - *shared
              - 'packages/sati/sati/loganomaly/**'
            katyayani-pooled:
              - *shared
              - 'packages/sati/sati/rca/pooled.py'
              - 'packages/sati/sati/rca/pooledreport.py'
              - 'packages/sati/sati/rca/features.py'
              - 'packages/sati/sati/rca/model.py'
              - 'benchmark/live/dataset/**'
            brahmacharini:
              - *shared
              - 'packages/sati/sati/embed/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # packages/core is a dependency and is not on PyPI, so it is installed
      # from the tree in the same command.
      - run: pip install -e packages/core -e "packages/sati[dev]"
      # CPU PyTorch for Kushmanda's model tests; training itself runs on Kaggle.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check packages/sati
      - run: pytest packages/sati -q

  kushmanda-smoke:
    # Kushmanda trains for hours on Kaggle. This runs the whole pipeline on
    # the real sources at toy size on CPU: corpus, tokenizer, pretraining,
    # grounded tuning, evaluation and report. A mistake then costs minutes
    # here, not a Kaggle session. NVD is left out (--tiny) to keep it short.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.kushmanda-smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati tokenizers
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: tiny end-to-end run
        working-directory: packages/sati
        run: |
          python -m sati.lm.train --tiny --out ../../results/kushmanda-smoke --cache ../../.cache/corpus
          python -m sati.lm.report ../../results/kushmanda-smoke/results.json

  sati-rca:
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.sati-rca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      # The download is cached per dataset revision inside the cache directory,
      # so a new upload to RCAEval is fetched fresh rather than mixed in.
      - uses: actions/cache@v4
        with:
          path: .cache/rcaeval
          key: rcaeval-v1
      - name: train and evaluate on RCAEval
        working-directory: packages/sati
        run: python -m sati.rca.run --cache ../../.cache/rcaeval --out ../../results/sati-rca
      - uses: actions/upload-artifact@v4
        with:
          name: sati-rca
          path: results/sati-rca/
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models
          cp results/sati-rca/results.json docs/research/models/sati-rca.results.json
          cp results/sati-rca/sati-rca-v0.meta.json docs/research/models/sati-rca-v0.meta.json
          # The website's Models page reads this copy; Vercel redeploys on the
          # push, so the published numbers follow the latest run (adr/Navadurga).
          cp results/sati-rca/results.json apps/web/lib/models/katyayani.results.json
          (cd packages/sati && python -m sati.rca.report ../../results/sati-rca/results.json) > docs/research/models/sati-rca.md
          bash scripts/pushresults.sh "docs(models): Sati-RCA v0 results from run ${{ github.run_id }}" docs/research/models/sati-rca.results.json docs/research/models/sati-rca-v0.meta.json docs/research/models/sati-rca.md apps/web/lib/models/katyayani.results.json

  shailaputri:
    # Model 1 of the nine (adr/Navadurga): metric anomaly detection on NAB's
    # real series, leave-one-family-out, against the four statistical detectors.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.shailaputri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/nab
          key: nab-v1
      - name: train and evaluate on NAB
        working-directory: packages/sati
        # Pinned: the commit every reported number was measured at. Bumping it
        # is a deliberate change, not something a rerun does on its own.
        run: python -m sati.detect.run --cache ../../.cache/nab --out ../../results/shailaputri --revision ea702d75cc2258d9d7dd35ca8e5e2539d71f3140
      - uses: actions/upload-artifact@v4
        with:
          name: shailaputri
          path: results/shailaputri/
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/shailaputri/results.json docs/research/models/shailaputri.results.json
          cp results/shailaputri/shailaputri-v0.meta.json docs/research/models/shailaputri-v0.meta.json
          cp results/shailaputri/results.json apps/web/lib/models/shailaputri.results.json
          (cd packages/sati && python -m sati.detect.report ../../results/shailaputri/results.json) > docs/research/models/shailaputri.md
          bash scripts/pushresults.sh "docs(models): Shailaputri v0 results from run ${{ github.run_id }}" docs/research/models/shailaputri.results.json docs/research/models/shailaputri-v0.meta.json docs/research/models/shailaputri.md apps/web/lib/models/shailaputri.results.json

  shailaputri-smd:
    # Shailaputri v1 (RP-60): 28 real servers x 38 metrics from SMD (MIT),
    # leave one machine group out, against max-robust-z and per-machine PCA,
    # plus an onset-weighted variant for earlier flags. Pinned commit.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.shailaputri-smd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/smd
          key: smd-omnianomaly-pinned
      - name: train and evaluate on SMD
        working-directory: packages/sati
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m sati.detect.smd --cache ../../.cache/smd --out ../../results/shailaputri-smd
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/shailaputri-smd/results.json docs/research/models/shailaputri-smd.results.json
          cp results/shailaputri-smd/results.json apps/web/lib/models/shailaputri-smd.results.json
          (cd packages/sati && python -m sati.detect.smdreport ../../results/shailaputri-smd/results.json) > docs/research/models/shailaputri-smd.md
          bash scripts/pushresults.sh "docs(models): Shailaputri v1 (SMD) results from run ${{ github.run_id }}" docs/research/models/shailaputri-smd.results.json docs/research/models/shailaputri-smd.md apps/web/lib/models/shailaputri-smd.results.json

  mahagauri:
    # Model 8 of the nine (adr/Navadurga): verification on SMD's real
    # incidents: has the server returned to normal? Leave one machine group
    # out; premature all-clears are the error that matters.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mahagauri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/smd
          key: smd-omnianomaly-pinned
      - name: train and evaluate on SMD incidents
        working-directory: packages/sati
        run: python -m sati.verify.run --cache ../../.cache/smd --out ../../results/mahagauri
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/mahagauri/results.json docs/research/models/mahagauri.results.json
          cp results/mahagauri/results.json apps/web/lib/models/mahagauri.results.json
          (cd packages/sati && python -m sati.verify.report ../../results/mahagauri/results.json) > docs/research/models/mahagauri.md
          bash scripts/pushresults.sh "docs(models): Mahagauri v0 results from run ${{ github.run_id }}" docs/research/models/mahagauri.results.json docs/research/models/mahagauri.md apps/web/lib/models/mahagauri.results.json

  skandamata:
    # Model 5 of the nine (adr/Navadurga): observed behaviour -> the ATT&CK
    # mitigations that defend against it, split by source, against popularity
    # and BM25 baselines. CPU. It recommends; Dharma authorises (rule 2).
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.skandamata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: corpus-mitigations
      - name: train and evaluate on ATT&CK
        working-directory: packages/sati
        run: python -m sati.respond.run --cache ../../.cache/corpus --out ../../results/skandamata
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/skandamata/results.json docs/research/models/skandamata.results.json
          cp results/skandamata/results.json apps/web/lib/models/skandamata.results.json
          (cd packages/sati && python -m sati.respond.report ../../results/skandamata/results.json) > docs/research/models/skandamata.md
          bash scripts/pushresults.sh "docs(models): Skandamata v0 results from run ${{ github.run_id }}" docs/research/models/skandamata.results.json docs/research/models/skandamata.md apps/web/lib/models/skandamata.results.json

  siddhidatri:
    # Model 9 of the nine (adr/Navadurga): Shailaputri, max robust z and PCA
    # fused into one calibrated probability on SMD, stacked out of fold.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.siddhidatri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/smd
          key: smd-omnianomaly-pinned
      - name: fuse and evaluate on SMD
        working-directory: packages/sati
        run: python -m sati.fuse.run --cache ../../.cache/smd --out ../../results/siddhidatri
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/siddhidatri/results.json docs/research/models/siddhidatri.results.json
          cp results/siddhidatri/results.json apps/web/lib/models/siddhidatri.results.json
          (cd packages/sati && python -m sati.fuse.report ../../results/siddhidatri/results.json) > docs/research/models/siddhidatri.md
          bash scripts/pushresults.sh "docs(models): Siddhidatri v0 results from run ${{ github.run_id }}" docs/research/models/siddhidatri.results.json docs/research/models/siddhidatri.md apps/web/lib/models/siddhidatri.results.json

  katyayani-kaal:
    # RP-24: Katyayani's ranker on Kaal dataset v1 (synthetic), on the committed
    # manifest's splits; about a minute on CPU.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.katyayani-kaal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - name: train and evaluate on Kaal v1
        working-directory: packages/sati
        run: python -m sati.rca.kaal --n 50000 --seed 1 --manifest ../../docs/research/datasets/kaal-v1.json --out ../../results/katyayani-kaal
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models
          cp results/katyayani-kaal/results.json docs/research/models/katyayani-kaal.results.json
          (cd packages/sati && python -m sati.rca.kaalreport ../../results/katyayani-kaal/results.json) > docs/research/models/katyayani-kaal.md
          bash scripts/pushresults.sh "docs(models): Katyayani on Kaal results from run ${{ github.run_id }}" docs/research/models/katyayani-kaal.results.json docs/research/models/katyayani-kaal.md

  katyayani-simtoreal:
    # RP-24 sim-to-real: the Kaal-trained ranker, zero-shot on RCAEval's
    # Online Boutique and Sock Shop cases with authored call graphs.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.katyayani-simtoreal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/rcaeval
          key: rcaeval-v1
      - name: train on Kaal, test zero-shot on RCAEval
        working-directory: packages/sati
        run: python -m sati.rca.simtoreal --cache ../../.cache/rcaeval --out ../../results/katyayani-simtoreal
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models
          cp results/katyayani-simtoreal/results.json docs/research/models/katyayani-simtoreal.results.json
          (cd packages/sati && python -m sati.rca.simtoreport ../../results/katyayani-simtoreal/results.json) > docs/research/models/katyayani-simtoreal.md
          bash scripts/pushresults.sh "docs(models): Katyayani sim-to-real results from run ${{ github.run_id }}" docs/research/models/katyayani-simtoreal.results.json docs/research/models/katyayani-simtoreal.md

  kalaratri:
    # Model 7 of the nine (adr/Navadurga): log anomaly detection on LogHub HDFS,
    # split by time. LogHub is research-use only, so this job publishes metrics
    # and no weights (datasheets.md).
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.kalaratri == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/loghub
          key: loghub-hdfs-v1
      - name: train and evaluate on LogHub HDFS
        working-directory: packages/sati
        run: python -m sati.loganomaly.run --cache ../../.cache/loghub --out ../../results/kalaratri
      - uses: actions/cache@v4
        with:
          path: .cache/loghub-bgl
          key: loghub-bgl-v1
      - name: train and evaluate on LogHub BGL
        working-directory: packages/sati
        run: python -m sati.loganomaly.run --dataset bgl --cache ../../.cache/loghub-bgl --out ../../results/kalaratri-bgl
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          for name in kalaratri kalaratri-bgl; do
            cp results/$name/results.json docs/research/models/$name.results.json
            cp results/$name/results.json apps/web/lib/models/$name.results.json
            (cd packages/sati && python -m sati.loganomaly.report ../../results/$name/results.json) > docs/research/models/$name.md
          done
          bash scripts/pushresults.sh "docs(models): Kalaratri v0 results (HDFS, BGL) from run ${{ github.run_id }}" docs/research/models/kalaratri.results.json docs/research/models/kalaratri.md apps/web/lib/models/kalaratri.results.json docs/research/models/kalaratri-bgl.results.json docs/research/models/kalaratri-bgl.md apps/web/lib/models/kalaratri-bgl.results.json

  brahmacharini:
    # Model 2 of the nine (adr/Navadurga): embeddings for memory and recall,
    # trained contrastively on ATT&CK procedure examples, tested on sources
    # never seen in training. Small enough for CPU.
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.brahmacharini == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: attack-corpus-v1
      - name: train and evaluate on ATT&CK procedure examples
        working-directory: packages/sati
        run: python -m sati.embed.run --cache ../../.cache/corpus --out ../../results/brahmacharini
      - name: export the served model for the API
        working-directory: packages/sati
        run: python -m sati.embed.export --cache ../../.cache/corpus --out ../../services/api/app/sati_models
      - uses: actions/upload-artifact@v4
        with:
          name: brahmacharini
          path: results/brahmacharini/
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/brahmacharini/results.json docs/research/models/brahmacharini.results.json
          cp results/brahmacharini/results.json apps/web/lib/models/brahmacharini.results.json
          (cd packages/sati && python -m sati.embed.report ../../results/brahmacharini/results.json) > docs/research/models/brahmacharini.md
          bash scripts/pushresults.sh "docs(models): Brahmacharini v0 results and served model from run ${{ github.run_id }}" docs/research/models/brahmacharini.results.json docs/research/models/brahmacharini.md apps/web/lib/models/brahmacharini.results.json services/api/app/sati_models
