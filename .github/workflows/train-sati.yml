name: Train Sati models

# Sati models are trained here, on GitHub's runners, on real public data —
# never on the owner's machine (adr/RealDataModels). The repository is public,
# so these minutes are free.
#
# Test, then train and evaluate on every split, then commit the generated
# results table. The trained model and the full results are kept as the
# `sati-rca` artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/sati/**
      - .github/workflows/train-sati.yml

permissions:
  contents: read

concurrency:
  group: train-sati
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # packages/core is a dependency and is not on PyPI, so it is installed
      # from the tree in the same command.
      - run: pip install -e packages/core -e "packages/sati[dev]"
      # CPU PyTorch for Kushmanda's model tests; training itself runs on Kaggle.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check packages/sati
      - run: pytest packages/sati -q

  kushmanda-smoke:
    # Kushmanda trains for hours on Kaggle. This runs the whole pipeline on
    # the real sources at toy size on CPU: corpus, tokenizer, pretraining,
    # grounded tuning, evaluation and report. A mistake then costs minutes
    # here, not a Kaggle session. NVD is left out (--tiny) to keep it short.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati tokenizers
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: tiny end-to-end run
        working-directory: packages/sati
        run: |
          python -m sati.lm.train --tiny --out ../../results/kushmanda-smoke --cache ../../.cache/corpus
          python -m sati.lm.report ../../results/kushmanda-smoke/results.json

  sati-rca:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      # The download is cached per dataset revision inside the cache directory,
      # so a new upload to RCAEval is fetched fresh rather than mixed in.
      - uses: actions/cache@v4
        with:
          path: .cache/rcaeval
          key: rcaeval-v1
      - name: train and evaluate on RCAEval
        working-directory: packages/sati
        run: python -m sati.rca.run --cache ../../.cache/rcaeval --out ../../results/sati-rca
      - uses: actions/upload-artifact@v4
        with:
          name: sati-rca
          path: results/sati-rca/
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models
          cp results/sati-rca/results.json docs/research/models/sati-rca.results.json
          cp results/sati-rca/sati-rca-v0.meta.json docs/research/models/sati-rca-v0.meta.json
          # The website's Models page reads this copy; Vercel redeploys on the
          # push, so the published numbers follow the latest run (adr/Navadurga).
          cp results/sati-rca/results.json apps/web/lib/models/katyayani.results.json
          (cd packages/sati && python -m sati.rca.report ../../results/sati-rca/results.json) > docs/research/models/sati-rca.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/models apps/web/lib/models
          if git diff --cached --quiet; then echo "results unchanged"; exit 0; fi
          git commit -m "docs(models): Sati-RCA v0 results from run ${{ github.run_id }}"
          # Parallel jobs push to main at once. Retry with backoff, and fail the step
          # if the results never land: a loop ending in `sleep` exits 0, which hid a
          # lost push of the BGL results on 19 Oct.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 15))
          done
          echo "::error::could not push the results after 6 attempts"
          exit 1

  shailaputri:
    # Model 1 of the nine (adr/Navadurga): metric anomaly detection on NAB's
    # real series, leave-one-family-out, against the four statistical detectors.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/nab
          key: nab-v1
      - name: train and evaluate on NAB
        working-directory: packages/sati
        # Pinned: the commit every reported number was measured at. Bumping it
        # is a deliberate change, not something a rerun does on its own.
        run: python -m sati.detect.run --cache ../../.cache/nab --out ../../results/shailaputri --revision ea702d75cc2258d9d7dd35ca8e5e2539d71f3140
      - uses: actions/upload-artifact@v4
        with:
          name: shailaputri
          path: results/shailaputri/
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/shailaputri/results.json docs/research/models/shailaputri.results.json
          cp results/shailaputri/shailaputri-v0.meta.json docs/research/models/shailaputri-v0.meta.json
          cp results/shailaputri/results.json apps/web/lib/models/shailaputri.results.json
          (cd packages/sati && python -m sati.detect.report ../../results/shailaputri/results.json) > docs/research/models/shailaputri.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/models apps/web/lib/models
          if git diff --cached --quiet; then echo "results unchanged"; exit 0; fi
          git commit -m "docs(models): Shailaputri v0 results from run ${{ github.run_id }}"
          # Parallel jobs push to main at once. Retry with backoff, and fail the step
          # if the results never land: a loop ending in `sleep` exits 0, which hid a
          # lost push of the BGL results on 19 Oct.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 15))
          done
          echo "::error::could not push the results after 6 attempts"
          exit 1

  kalaratri:
    # Model 7 of the nine (adr/Navadurga): log anomaly detection on LogHub HDFS,
    # split by time. LogHub is research-use only, so this job publishes metrics
    # and no weights (datasheets.md).
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/loghub
          key: loghub-hdfs-v1
      - name: train and evaluate on LogHub HDFS
        working-directory: packages/sati
        run: python -m sati.loganomaly.run --cache ../../.cache/loghub --out ../../results/kalaratri
      - uses: actions/cache@v4
        with:
          path: .cache/loghub-bgl
          key: loghub-bgl-v1
      - name: train and evaluate on LogHub BGL
        working-directory: packages/sati
        run: python -m sati.loganomaly.run --dataset bgl --cache ../../.cache/loghub-bgl --out ../../results/kalaratri-bgl
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          for name in kalaratri kalaratri-bgl; do
            cp results/$name/results.json docs/research/models/$name.results.json
            cp results/$name/results.json apps/web/lib/models/$name.results.json
            (cd packages/sati && python -m sati.loganomaly.report ../../results/$name/results.json) > docs/research/models/$name.md
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/models apps/web/lib/models
          if git diff --cached --quiet; then echo "results unchanged"; exit 0; fi
          git commit -m "docs(models): Kalaratri v0 results (HDFS, BGL) from run ${{ github.run_id }}"
          # Parallel jobs push to main at once. Retry with backoff, and fail the step
          # if the results never land: a loop ending in `sleep` exits 0, which hid a
          # lost push of the BGL results on 19 Oct.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 15))
          done
          echo "::error::could not push the results after 6 attempts"
          exit 1

  brahmacharini:
    # Model 2 of the nine (adr/Navadurga): embeddings for memory and recall,
    # trained contrastively on ATT&CK procedure examples, tested on sources
    # never seen in training. Small enough for CPU.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: .cache/corpus
          key: attack-corpus-v1
      - name: train and evaluate on ATT&CK procedure examples
        working-directory: packages/sati
        run: python -m sati.embed.run --cache ../../.cache/corpus --out ../../results/brahmacharini
      - name: export the served model for the API
        working-directory: packages/sati
        run: python -m sati.embed.export --cache ../../.cache/corpus --out ../../services/api/app/sati_models
      - uses: actions/upload-artifact@v4
        with:
          name: brahmacharini
          path: results/brahmacharini/
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/brahmacharini/results.json docs/research/models/brahmacharini.results.json
          cp results/brahmacharini/results.json apps/web/lib/models/brahmacharini.results.json
          (cd packages/sati && python -m sati.embed.report ../../results/brahmacharini/results.json) > docs/research/models/brahmacharini.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/models apps/web/lib/models services/api/app/sati_models
          if git diff --cached --quiet; then echo "results unchanged"; exit 0; fi
          git commit -m "docs(models): Brahmacharini v0 results and served model from run ${{ github.run_id }}"
          # Parallel jobs push to main at once. Retry with backoff, and fail the step
          # if the results never land: a loop ending in `sleep` exits 0, which hid a
          # lost push of the BGL results on 19 Oct.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 15))
          done
          echo "::error::could not push the results after 6 attempts"
          exit 1
