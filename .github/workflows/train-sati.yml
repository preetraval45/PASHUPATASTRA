name: Train Sati models

# Sati models are trained here, on GitHub's runners, on real public data —
# never on the owner's machine (adr/RealDataModels). The repository is public,
# so these minutes are free.
#
# Test, then train and evaluate on every split, then commit the generated
# results table. The trained model and the full results are kept as the
# `sati-rca` artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/sati/**
      - .github/workflows/train-sati.yml

permissions:
  contents: read

concurrency:
  group: train-sati
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # packages/core is a dependency and is not on PyPI, so it is installed
      # from the tree in the same command.
      - run: pip install -e packages/core -e "packages/sati[dev]"
      - run: ruff check packages/sati
      - run: pytest packages/sati -q

  sati-rca:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      # The download is cached per dataset revision inside the cache directory,
      # so a new upload to RCAEval is fetched fresh rather than mixed in.
      - uses: actions/cache@v4
        with:
          path: .cache/rcaeval
          key: rcaeval-v1
      - name: train and evaluate on RCAEval
        working-directory: packages/sati
        run: python -m sati.rca.run --cache ../../.cache/rcaeval --out ../../results/sati-rca
      - uses: actions/upload-artifact@v4
        with:
          name: sati-rca
          path: results/sati-rca/
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models
          cp results/sati-rca/results.json docs/research/models/sati-rca.results.json
          cp results/sati-rca/sati-rca-v0.meta.json docs/research/models/sati-rca-v0.meta.json
          # The website's Models page reads this copy; Vercel redeploys on the
          # push, so the published numbers follow the latest run (adr/Navadurga).
          cp results/sati-rca/results.json apps/web/lib/models/katyayani.results.json
          (cd packages/sati && python -m sati.rca.report ../../results/sati-rca/results.json) > docs/research/models/sati-rca.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/models apps/web/lib/models
          if git diff --cached --quiet; then echo "results unchanged"; exit 0; fi
          git commit -m "docs(models): Sati-RCA v0 results from run ${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main

  shailaputri:
    # Model 1 of the nine (adr/Navadurga): metric anomaly detection on NAB's
    # real series, leave-one-family-out, against the four statistical detectors.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/nab
          key: nab-v1
      - name: train and evaluate on NAB
        working-directory: packages/sati
        run: python -m sati.detect.run --cache ../../.cache/nab --out ../../results/shailaputri
      - uses: actions/upload-artifact@v4
        with:
          name: shailaputri
          path: results/shailaputri/
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/shailaputri/results.json docs/research/models/shailaputri.results.json
          cp results/shailaputri/shailaputri-v0.meta.json docs/research/models/shailaputri-v0.meta.json
          cp results/shailaputri/results.json apps/web/lib/models/shailaputri.results.json
          (cd packages/sati && python -m sati.detect.report ../../results/shailaputri/results.json) > docs/research/models/shailaputri.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/models apps/web/lib/models
          if git diff --cached --quiet; then echo "results unchanged"; exit 0; fi
          git commit -m "docs(models): Shailaputri v0 results from run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done

  kalaratri:
    # Model 7 of the nine (adr/Navadurga): log anomaly detection on LogHub HDFS,
    # split by time. LogHub is research-use only, so this job publishes metrics
    # and no weights (datasheets.md).
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e packages/sati
      - uses: actions/cache@v4
        with:
          path: .cache/loghub
          key: loghub-hdfs-v1
      - name: train and evaluate on LogHub HDFS
        working-directory: packages/sati
        run: python -m sati.logs.run --cache ../../.cache/loghub --out ../../results/kalaratri
      - name: commit the generated results
        run: |
          mkdir -p docs/research/models apps/web/lib/models
          cp results/kalaratri/results.json docs/research/models/kalaratri.results.json
          cp results/kalaratri/results.json apps/web/lib/models/kalaratri.results.json
          (cd packages/sati && python -m sati.logs.report ../../results/kalaratri/results.json) > docs/research/models/kalaratri.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/models apps/web/lib/models
          if git diff --cached --quiet; then echo "results unchanged"; exit 0; fi
          git commit -m "docs(models): Kalaratri v0 results from run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
