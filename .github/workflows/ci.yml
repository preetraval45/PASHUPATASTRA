name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # OIDC federation for AWS — no long-lived access keys in CI (docs/SECURITY.md T9).
  id-token: write

jobs:
  core:
    name: core (must run without a cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/core[dev]"
      - run: pytest packages/core -q
      - run: ruff check packages/core
      - name: detection benchmark holds its recorded result
        # The seasonality decision (ADR Seasonality) rests on measured numbers,
        # so the measurement runs here rather than living in a commit message.
        # Fails if the recommended seasonal strategy stops winning.
        run: python scripts/benchdetect.py --strict

      - name: phase 2 loop holds against the labelled corpus
        # Detection, correlation and recall scored against known answers.
        # --strict fails only on a false alarm or an incorrect grouping: those
        # are actively harmful, where a miss is merely disappointing. NOT a
        # benchmark result — telemetry replay, and reasoning quality is not
        # measured here at all (see the script's docstring).
        run: python scripts/benchphase2.py --strict
      - name: assert packages/core has no AWS or model-SDK imports
        # Two rules, one gate. The Platform ADR: the domain model stays
        # cloud-free and laptop-runnable. CLAUDE.md rule 5: model access goes
        # through the AI Gateway abstraction, so the vendor SDK lives behind a
        # provider in services/api and core never learns which one is in use.
        run: |
          if grep -rnE '^\s*(import|from)\s+(boto3|botocore|aiobotocore)' packages/core/pashupatastra; then
            echo "::error::packages/core must contain zero AWS imports (the Platform ADR)"
            exit 1
          fi
          if grep -rnE '^\s*(import|from)\s+(anthropic|openai)' packages/core/pashupatastra; then
            echo "::error::packages/core must not import a model SDK — go through the AI Gateway (rule 5)"
            exit 1
          fi

      - name: assert engines reach models only through the gateway
        # The providers package is the sole permitted importer of a model SDK.
        # Without this, rule 5 holds only until someone adds one convenient call.
        run: |
          if grep -rnE '^\s*(import|from)\s+anthropic' services/api/app \
             --exclude-dir=providers; then
            echo "::error::only app/engines/providers/ may import a model SDK (rule 5)"
            exit 1
          fi

  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pashupatastra
          POSTGRES_PASSWORD: pashupatastra
          POSTGRES_DB: pashupatastra
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pashupatastra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e "services/api[dev]"
      - name: apply migrations
        working-directory: services/api
        run: python -m app.migrate
      - name: tests
        # Postgres is a service here, so the persistence tests run rather than
        # skip. A green api job means the schema invariants were exercised.
        working-directory: services/api
        run: pytest -q
      - name: OpenAPI contract is current
        working-directory: services/api
        run: python -m app.exportopenapi --check
      - run: ruff check services/api

  connectors:
    name: connectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e "packages/connectors[dev]"
      - run: pytest packages/connectors -q
      - run: ruff check packages/connectors

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - name: no high or critical advisories
        # Threshold is `high`: moderate findings are reported but do not fail the
        # build, because a gate that fires constantly gets bypassed and then the
        # critical one lands unnoticed — the same argument the detection layer
        # makes about false alarms.
        #
        # This job exists because the pin sat a year stale at next@15.1.6 and
        # nobody found out until someone happened to read install output. A
        # security platform learning about its own CVEs by accident is the
        # problem this prevents.
        run: npm audit --audit-level=high
      - name: report everything else
        if: always()
        run: npm audit || true

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
