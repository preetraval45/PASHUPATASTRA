name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Results committed by these workflows are pushed with GITHUB_TOKEN, which
  # never triggers another workflow. Without this, a retrained model (for
  # example Brahmacharini's served files in services/api/app/sati_models)
  # would sit on main and never reach Lambda. Checkout takes main's head.
  workflow_run:
    workflows: ["Train Sati models", "Benchmark", "Train Kushmanda on Kaggle", "World threat data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # OIDC federation for AWS — no long-lived access keys in CI (docs/SECURITY.md T9).
  id-token: write

jobs:
  core:
    name: core (must run without a cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "packages/core[dev]"
      - run: pytest packages/core -q
      # The benchmark harness's own tests — the arms, the LLM proposer's
      # refusals and rejections (RP-07). No cluster is touched.
      - name: benchmark harness tests
        run: PYTHONPATH=packages/core:. pytest benchmark/harness benchmark/live -q -o python_files="test*.py"
      - run: ruff check packages/core
      - name: Kaal dataset v1 matches its committed manifest, and the guard passes
        # RP-18: the split manifest was committed before any training. If the
        # generator changes, every split moves; this makes that a deliberate
        # regeneration rather than a silent one. About ten seconds.
        working-directory: packages/core
        run: python -m pashupatastra.kaal.dataset --n 50000 --seed 1 --manifest ../../docs/research/datasets/kaal-v1.json --check
      - name: detection benchmark holds its recorded result
        # The seasonality decision (ADR Seasonality) rests on measured numbers,
        # so the measurement runs here rather than living in a commit message.
        # Fails if the recommended seasonal strategy stops winning.
        run: python scripts/benchdetect.py --strict

      - name: phase 2 loop holds against the labelled corpus
        # Detection, correlation and recall scored against known answers.
        # --strict fails only on a false alarm or an incorrect grouping: those
        # are actively harmful, where a miss is merely disappointing. NOT a
        # benchmark result — telemetry replay, and reasoning quality is not
        # measured here at all (see the script's docstring).
        run: python scripts/benchphase2.py --strict
      - name: assert packages/core has no AWS or model-SDK imports
        # Two rules, one gate. The Platform ADR: the domain model stays
        # cloud-free and laptop-runnable. CLAUDE.md rule 5: model access goes
        # through the AI Gateway abstraction, so the vendor SDK lives behind a
        # provider in services/api and core never learns which one is in use.
        run: |
          if grep -rnE '^\s*(import|from)\s+(boto3|botocore|aiobotocore)' packages/core/pashupatastra; then
            echo "::error::packages/core must contain zero AWS imports (the Platform ADR)"
            exit 1
          fi
          if grep -rnE '^\s*(import|from)\s+(anthropic|openai)' packages/core/pashupatastra; then
            echo "::error::packages/core must not import a model SDK — go through the AI Gateway (rule 5)"
            exit 1
          fi

      - name: assert engines reach models only through the gateway
        # The providers package is the sole permitted importer of a model SDK.
        # Without this, rule 5 holds only until someone adds one convenient call.
        run: |
          if grep -rnE '^\s*(import|from)\s+anthropic' services/api/app \
             --exclude-dir=providers; then
            echo "::error::only app/engines/providers/ may import a model SDK (rule 5)"
            exit 1
          fi

  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pashupatastra
          POSTGRES_PASSWORD: pashupatastra
          POSTGRES_DB: pashupatastra
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pashupatastra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # All three editable installs in one resolve: the API depends on
      # `pashupatastra-connectors` (R88), and a line that omitted it went to
      # PyPI for a package that is only ever installed from this repository.
      # Every api run since 24 August failed on this step before a test ran.
      - run: pip install -e packages/core -e packages/connectors -e "services/api[dev]"
      - name: apply migrations
        working-directory: services/api
        run: python -m app.migrate
      - name: tests
        # Postgres is a service here, so the persistence tests run rather than
        # skip. A green api job means the schema invariants were exercised.
        working-directory: services/api
        run: pytest -q
      - name: tests, in the deployed configuration
        # The security console with its scenarios seeded. The chat battery
        # (R103), the proposal test (R20) and the Blue Team suites only run
        # against a seeded store, and only this configuration seeds one — so
        # without this step the tests that guard the public site skip on every
        # run and report green.
        working-directory: services/api
        env:
          PASHU_DEMO_SEED: "true"
          PASHU_ACTION_DOMAIN: security
        run: pytest -q
      - name: OpenAPI contract is current
        working-directory: services/api
        run: python -m app.exportopenapi --check
      - run: ruff check services/api

  connectors:
    name: connectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e packages/core -e "packages/connectors[dev]"
      - run: pytest packages/connectors -q
      - run: ruff check packages/connectors

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-site:
    name: deploy site
    # A fallback, not the primary path any more. Every Git-triggered Vercel
    # build failed from September to 9 October on a project setting no log
    # from outside the dashboard could name — the Root Directory was unset, so
    # Vercel ran `npm run build` at the repository root, which has no
    # package.json. That is fixed in the dashboard and Git deploys are on
    # again, so a push normally deploys itself.
    #
    # This job stays because it is the readable path: the site is built here,
    # from the same tree the `web` job just proved, and handed over prebuilt.
    # It only runs when all three secrets are set, so it is inert unless
    # somebody deliberately turns it on — and if they do, note that a push
    # would then deploy twice, once from here and once from Git.
    #
    # Gated on every test job. Needs three repository secrets: VERCEL_TOKEN
    # (Account → Settings → Tokens), VERCEL_ORG_ID (Team → Settings → General,
    # "Team ID") and VERCEL_PROJECT_ID (Project → Settings → General). Without
    # them the job says so and stops, rather than failing the run.
    needs: [core, api, connectors, web, dependencies, secrets]
    if: (github.event_name == 'push' || github.event_name == 'workflow_run') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: secrets present?
        id: gate
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are not all set — the site was tested but not deployed"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci || npm install
      - name: pull the project's production settings and environment
        if: steps.gate.outputs.ready == 'true'
        run: npx vercel@50 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: build, here
        if: steps.gate.outputs.ready == 'true'
        run: npx vercel@50 build --prod --token="$VERCEL_TOKEN"
      - name: deploy the prebuilt output
        if: steps.gate.outputs.ready == 'true'
        run: npx vercel@50 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci || npm install
      - name: nothing high or critical reaches a browser
        # Split in two, because "shipped to a visitor" and "ran once on a build
        # machine" are different risks and one threshold for both means either
        # tolerating the first or blocking on the second.
        #
        # Production dependencies: high or critical fails, full stop. This is
        # the gate that matters and it is currently clean.
        #
        # Threshold is `high` rather than `moderate`: a gate that fires
        # constantly gets bypassed, and then the critical one lands unnoticed —
        # the same argument the detection layer makes about false alarms.
        #
        # This job exists because the pin sat a year stale at next@15.1.6 and
        # nobody found out until someone happened to read install output. A
        # security platform learning about its own CVEs by accident is the
        # problem this prevents.
        run: npm audit --audit-level=high --omit=dev
      - name: build tooling, reported and bounded
        # Dev-only advisories fail on `critical` only. Today there are five
        # highs here and every one is the Tailwind 3 file-watching chain
        # (braces -> micromatch -> fast-glob -> chokidar -> tailwindcss). None
        # of it is reachable from a browser; all of it is a ReDoS in glob
        # matching during a build.
        #
        # npm's fix for the chain is tailwindcss@4, which is a full major
        # migration — v4 moves configuration into CSS and would rewrite the
        # styling layer of every page. That is a decision, not a patch, and it
        # is tracked as its own task rather than taken under time pressure by
        # an audit gate. Until then this is visible on every run instead of
        # being silenced.
        run: npm audit --audit-level=critical
      - name: report everything else
        if: always()
        run: npm audit || true

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action rejects the workflow_run event. Those runs only follow
      # bot commits of generated results; every human push is scanned here.
      - uses: gitleaks/gitleaks-action@v3
        if: github.event_name != 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-api:
    name: deploy api
    # The API on Lambda had drifted weeks behind main — /usage, /figures,
    # /impact, /attack/matrix, /detections and /models all answered 404 in
    # production on 18 October while the site linked to them — because the only
    # deploy path was a command run by hand from a machine with AWS keys. The
    # owner wants nothing run from their machine, so it runs here, after every
    # test job, from the tree those jobs just proved.
    #
    # Inert until two repository secrets exist: AWS_ACCESS_KEY_ID and
    # AWS_SECRET_ACCESS_KEY (the IAM user made for this project). Without them
    # the job says so and stops, rather than failing the run.
    #
    # Safe to re-run: deploylambda.py carries the model key already on the
    # function forward, because update-function-configuration replaces the
    # whole environment block; createdynamo.py leaves an existing table alone;
    # and a DynamoDB the role cannot reach falls back to memory, never to errors.
    needs: [core, api, connectors, web, dependencies, secrets]
    if: (github.event_name == 'push' || github.event_name == 'workflow_run') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      API: https://265d0hsmwa.execute-api.us-east-1.amazonaws.com/api/v1
      # The owner's decision (18 Oct 2026): answers come from Sati's own models.
      # Without this, deploylambda.py finds no third-party key and ships the echo
      # stub, which would silently replace the live provider on the first CI deploy.
      PASHU_MODEL_PROVIDER: sati
    steps:
      - name: secrets present?
        id: gate
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are not set — the API was tested but not deployed"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: who is deploying
        if: steps.gate.outputs.ready == 'true'
        run: aws sts get-caller-identity --query Arn --output text
      - name: AWS SDK for the table script
        if: steps.gate.outputs.ready == 'true'
        run: pip install boto3
      - name: Kushmanda's private weights (owner decision, 27 Oct 2026)
        # Fetched from the owner's private Kaggle model and exported to int8 for
        # the numpy engine, into a git-ignored folder: they reach the Lambda
        # archive and nothing else. Skipped, with a notice, without the secrets.
        if: steps.gate.outputs.ready == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::notice::KAGGLE_USERNAME / KAGGLE_API_TOKEN not set — the API deploys without Kushmanda"
            exit 0
          fi
          pip install --quiet "kaggle>=1.7" numpy
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          kaggle models instances versions download preetraval4518071604/sati-kushmanda/pyTorch/v2/1 -p /tmp/kushmanda --untar
          PYTHONPATH=packages/sati python - <<'PY'
          from pathlib import Path
          import shutil, torch
          from sati.lm.infer import export
          src = Path("/tmp/kushmanda")
          ckpt = torch.load(next(src.rglob("kushmanda-v2.pt")), map_location="cpu")
          out = Path("services/api/app/sati_models/kushmanda")
          export(ckpt["state"], ckpt["config"], out)
          shutil.copy(next(src.rglob("tokenizer.json")), out / "tokenizer.json")
          print("Kushmanda exported:", sorted(p.name for p in out.iterdir()))
          PY
      - name: build the archive
        if: steps.gate.outputs.ready == 'true'
        run: python scripts/buildlambda.py
      - name: the table it persists to
        if: steps.gate.outputs.ready == 'true'
        run: python scripts/createdynamo.py
      - name: deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          ROLE=$(aws lambda get-function-configuration --function-name pashupatastra-api --query Role --output text)
          if ! python scripts/deploylambda.py --role "$ROLE" --cors https://pashupatastra.vercel.app; then
            # Kushmanda must never block the rest of the API: retry without it.
            [ -d services/api/app/sati_models/kushmanda ] || exit 1
            echo "::warning::deploy with Kushmanda failed (archive size or S3 permissions); deploying without it"
            rm -rf services/api/app/sati_models/kushmanda
            python scripts/buildlambda.py
            python scripts/deploylambda.py --role "$ROLE" --cors https://pashupatastra.vercel.app
          fi
      - name: the routes the site needs answer
        if: steps.gate.outputs.ready == 'true'
        run: |
          sleep 10
          for path in health usage figures impact models attack/matrix detections; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API/$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -s "$API/health"
