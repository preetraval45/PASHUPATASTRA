name: Android app

# Builds the Android app (the live website in a native shell, apps/android) in the cloud and
# publishes the APK as the "android" release, so it can be downloaded and installed on a phone
# directly. Nothing builds on a developer's computer. Test builds are signed with the public test
# key in apps/android; a Play Store release will use a private key held as a secret instead.

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: each deletes and recreates the "android" release, and two at once
# raced (run 41327683570 failed publishing while another run held the tag).
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Play Store bundle is built only once the owner has added the private upload key.
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: build the release APK
        working-directory: apps/android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }} 2>&1 | tee build.log
      - name: say why the build failed
        if: failure()
        working-directory: apps/android
        # Gradle's own summary, as one annotation readable without opening the log.
        run: |
          reason=$( (grep -E -A25 "What went wrong|^e: |error:" build.log || tail -40 build.log) | head -60 )
          reason="${reason//'%'/'%25'}"; reason="${reason//$'\n'/'%0A'}"
          echo "::error title=Android build::${reason}"
      - name: build the Play Store bundle (signed with the private upload key)
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: apps/android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks" gradle --no-daemon bundleRelease -Pplay             -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: Pashupatastra-play-bundle
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
      - name: name it for a phone
        run: cp apps/android/app/build/outputs/apk/release/app-release.apk Pashupatastra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pashupatastra-apk
          path: Pashupatastra.apk
      - name: publish as the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Pashupatastra.apk \
            --target "${{ github.sha }}" \
            --title "Android app (test build ${{ github.run_number }})" \
            --notes "Install on an Android phone: download Pashupatastra.apk, open it, and allow installs from this source when Android asks. The app shows the live website, so it updates whenever the site does. Built from ${{ github.sha }}."

  # The app, run: installed on an Android emulator in CI, opened on each main screen, and
  # photographed. Proof it starts and draws (no crash, no blank screen), and the screenshots
  # for the store listing. They are attached to the "android" release, so they can be viewed
  # without signing in.
  screens:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pashupatastra-apk
      - name: let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: open each screen and photograph it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash apps/android/screens.sh Pashupatastra.apk
      - name: fail on a crash
        # Only this app's crashes: the emulator's own apps crash too (run 41329316034: Google
        # Search's WebView hit SIGILL on the emulated CPU), and those say nothing about this app.
        run: |
          if grep -q "app.pashupatastra" crash.log 2>/dev/null; then
            cat crash.log
            echo "::error title=App crashed::$(head -c 1500 crash.log | paste -sd ' ')"
            exit 1
          fi
      - name: attach the screenshots to the "android" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # Whatever exists, so a failed run still leaves its evidence (summary.txt names the
        # screen where the app stopped running).
        # GitHub refuses an empty file, and crash.log is empty when nothing crashed.
        run: gh release upload android $(find . -maxdepth 1 -size +0 \( -name 'shot-*.png' -o -name logcat.txt -o -name summary.txt -o -name crash.log \)) --clobber --repo "${{ github.repository }}"
