# Automated dependency updates.
#
# The frontend pin sat a year behind at next@15.1.6, accumulating two critical
# advisories, and it surfaced only because someone read npm install output. The
# CI audit job now fails a build on high or critical findings; this file is the
# other half — it turns each update into a reviewable diff that arrives on its
# own, rather than a discovery made under pressure later.
#
# Grouped deliberately. Ten separate patch PRs a week get closed unread, which
# leaves the repository exactly as stale as having no automation at all.
version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next, React and their types move together; splitting them produces PRs
      # that cannot pass CI alone.
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      build-tooling:
        patterns: ["typescript", "tailwindcss", "postcss", "autoprefixer", "@types/node"]
        update-types: ["minor", "patch"]
    # Majors that are migrations, not bumps. Tailwind 4 replaces the PostCSS
    # plugin and the config format; TypeScript 7 is the new native compiler.
    # Grouped with patches they failed the whole build (27 Oct 2026, 8d3304e).
    # Each is a deliberate task when it is taken on.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /packages/core
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /packages/connectors
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Actions are supply chain too: a compromised action runs with the workflow's
  # permissions, and this workflow holds id-token: write for AWS federation.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
