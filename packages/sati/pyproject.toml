[project]
name = "pashupatastra-sati"
version = "0.2.0"
description = "Sati models: trained and tested on real data, served through the AI Gateway"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pashupatastra-core",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",  # classical baselines every model must beat
]

# NOTE (adr/RealDataModels): model code lives here, never in packages/core,
# which stays free of ML libraries and runnable on a laptop. Training runs on
# GitHub Actions and Kaggle — never on the owner's machine.

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5,<0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sati"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
