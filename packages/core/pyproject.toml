[project]
name = "pashupatastra-core"
version = "0.1.0"
description = "Pashupatastra core domain model: events, incidents, policy, agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "ulid-py>=1.1",
    "pyyaml>=6.0",
]

# NOTE (the Platform ADR): this package must contain ZERO AWS imports. No boto3, no ARNs
# in schemas, no assumption that a cloud exists. It has to run on a laptop.
# AWS SDK usage belongs in packages/connectors, services/api, and infra.

[project.optional-dependencies]
# `pysigma` is the reference Sigma parser, and it is a test dependency rather
# than a runtime one on purpose. R71's first clause is that a drafted rule
# parses as valid Sigma, and our own `sigma.validate` is not evidence of that —
# it is the same author checking their own work. The real parser is what makes
# the claim falsifiable, so it belongs in the test environment and nowhere near
# `packages/core`'s runtime dependencies, which have to stay small enough to run
# on a laptop.
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pysigma>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pashupatastra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Filenames carry no underscores, so widen pytest discovery from test_*.py
python_files = ["test*.py"]
